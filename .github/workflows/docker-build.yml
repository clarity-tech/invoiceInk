name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    # No paths-ignore on push: release.yml's tag-images polls for the image this
    # workflow publishes for that exact commit and fails the release if it never
    # appears.
  pull_request:
    branches:
      - main
      - develop
    # Safe on pull requests: nothing consumes a PR image now that the smoke
    # test runs inside the build job.
    paths-ignore:
      - '**.md'
      - 'version.txt'
      - '.release-please-manifest.json'

# A superseded image build has nothing to offer once a newer commit is pushed.
# `release` is deliberately excluded from this pattern -- it must not be
# cancelled mid-retag.
# Superseding a pull request build is free. A push build is kept so every main
# commit has an image to deploy or release.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for jobs that declare none; the publishing job widens this for itself.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test-php:
    name: PHP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          sed -i 's|FILESYSTEM_DISK=.*|FILESYSTEM_DISK=local|' .env
          echo "MEDIA_DISK=public" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "TELESCOPE_ENABLED=false" >> .env
          echo "GOTENBERG_ENABLED=true" >> .env
          echo "GOTENBERG_URL=http://localhost:3000" >> .env

      - name: Start Gotenberg PDF service
        run: |
          docker run -d --name gotenberg \
            -p 3000:3000 \
            gotenberg/gotenberg:8 \
            gotenberg --chromium-disable-javascript=true --api-timeout=30s
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done'

      - name: Run Unit & Feature tests
        run: php artisan test --testsuite=Unit,Feature --compact

  test-octane:
    name: Production Image (FrankenPHP) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies, build assets, and install Playwright
        run: |
          bun install --frozen-lockfile
          bun run build
          npx playwright install chromium --with-deps

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          echo "TELESCOPE_ENABLED=false" >> .env
          touch database/database.sqlite
          php artisan migrate --force

      # The `build` job builds this exact Dockerfile and target with a GitHub
      # Actions layer cache, one scope per architecture. Reading the amd64 scope
      # turns a ~4 minute cold build into a cache hit; `load: true` puts it in
      # the local daemon so test-octane.sh can run it. Cache is read-only --
      # `build` owns writing it, and two writers would just thrash the same key.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.frankenphp
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: invoicing-test:octane
          cache-from: type=gha,scope=frankenphp-amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      - name: Run production image tests
        env:
          SKIP_IMAGE_BUILD: '1'
        run: ./docker/production/test-octane.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs invoicing-octane-test 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: octane-browser-screenshots
          path: tests/Browser/Screenshots/
          retention-days: 7

  test-frontend:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (format check)
        run: vendor/bin/pint --test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --with-form must match `wayfinder({ formVariants: true })` in
      # vite.config.ts. Without it the generated route helpers have no .form
      # property, while the Auth pages use it -- so vue-tsc reported seven
      # errors that exist nowhere but here. The production Dockerfile already
      # passes this flag; only this step had drifted.
      - name: Generate Wayfinder typed routes
        run: php artisan wayfinder:generate --path=resources/js --with-form --no-interaction

      # A ratchet rather than a plain gate. 21 errors remain, all of them the
      # same thing: test mocks that are structurally right but are not the
      # branded `InertiaForm<T>` type the components declare. Clearing those
      # needs a typed factory and was deliberately deferred, so failing on any
      # error would fail every build.
      #
      # Failing on *more* than the known count still catches every new error,
      # which is the part worth enforcing. Lower this number as the remainder
      # is cleared; it must never be raised to accommodate new errors.
      - name: TypeScript check (ratchet)
        env:
          BASELINE: 21
        run: |
          set -o pipefail
          bun run types:check 2>&1 | tee /tmp/tsc.log || true
          COUNT=$(grep -cE 'error TS' /tmp/tsc.log || true)
          echo "type errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::$COUNT type errors, above the baseline of $BASELINE."
            grep -E 'error TS' /tmp/tsc.log || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::$COUNT type errors, below the baseline of $BASELINE -- lower BASELINE in this workflow."
          fi

      - name: Run Vitest
        run: bun run test

  # One native runner per architecture, so arm64 builds as fast as amd64 with
  # no QEMU. Pushes publish each platform by digest only and `publish` tags the
  # combined multi-arch index. Pull requests load each image into the runner's
  # own daemon and smoke-test it on its own architecture instead.
  build:
    name: build (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      # Let the other architecture finish, so a failure shows whether it is
      # specific to one platform.
      fail-fast: false
      matrix:
        target: [frankenphp]
        # target: [frankenphp, nginx-fpm, standalone, standalone-alpine]
        arch: [amd64, arm64]
        include:
          - target: frankenphp
            dockerfile: docker/production/Dockerfile.frankenphp
            image-suffix: ''
            build-target: production
            port: 8080
          # - target: nginx-fpm
          # dockerfile: docker/production/Dockerfile.nginx-fpm
          # image-suffix: '-nginx'
          # build-target: production
          # - target: standalone
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone'
          # build-target: runtime
          # - target: standalone-alpine
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone-alpine'
          # build-target: standalone-alpine
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # Image names must be lowercase; the repository name is not.
      - name: Set the image name
        run: echo "IMAGE=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}${{ matrix.image-suffix }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only; `publish` owns the tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build-target }}
          platforms: linux/${{ matrix.arch }}
          # Pushes publish this platform untagged, by digest. A pull request
          # has no consumer for its image (release.yml only ever retags a
          # `main` commit), so it is loaded for the smoke test instead.
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && format('{0}:pr-{1}', env.IMAGE, github.event.pull_request.number) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      - name: Export the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Runs here rather than in a separate job because a pull request's image
      # is only in this runner's local daemon -- there is nothing in the
      # registry for another job to pull.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          IMAGE="$IMAGE:pr-${{ github.event.pull_request.number }}"
          echo "Testing image: $IMAGE ($(uname -m))"

          docker run -d \
            --name test-container \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e "APP_KEY=base64:$(openssl rand -base64 32)" \
            -e APP_ENV=testing \
            -e APP_URL=http://localhost:${{ matrix.port }} \
            -e DB_CONNECTION=sqlite \
            -e "DB_DATABASE=/var/www/html/storage/database.sqlite" \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            -e AUTORUN_ENABLED=true \
            -e AUTORUN_LARAVEL_MIGRATION=true \
            -e AUTORUN_LARAVEL_MIGRATION_SKIP_DB_CHECK=true \
            -e AUTORUN_LARAVEL_OPTIMIZE=false \
            "$IMAGE"

          for i in {1..20}; do
            if curl -sf http://localhost:${{ matrix.port }}/up; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Container failed to start"
              docker logs test-container
              exit 1
            fi
            echo "Attempt $i, retrying..."
            sleep 3
          done

          curl -I http://localhost:${{ matrix.port }}/ | grep -E "(200|302)"

          docker stop test-container
          docker rm test-container

      # A pull request's image is loaded locally rather than pushed, so there is
      # no registry digest to scan -- point Trivy at the local tag instead. The
      # scan is `continue-on-error`, so an unresolvable ref would have failed
      # silently and quietly stopped scanning pull requests altogether.
      - name: Resolve the image reference to scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SCAN_REF=${IMAGE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          fi

      # Findings go to the run summary rather than the Security tab: uploading
      # SARIF needs Advanced Security, which this private repo does not have,
      # so that upload 403'd and failed the whole workflow on every build.
      #
      # `exit-code: 0` keeps the scan advisory. The image currently carries
      # fixable HIGH/CRITICAL findings from the Debian base, the bundled Node
      # packages and the FrankenPHP binary, so gating on them would fail every
      # build from the moment this lands. Turn the gate on once that backlog is
      # cleared -- the summary below is what makes the backlog visible.
      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: 'table'
          output: 'trivy-results-${{ matrix.target }}-${{ matrix.arch }}.txt'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Publish Trivy findings to the run summary
        if: always()
        run: |
          {
            echo "## Trivy — ${{ matrix.target }} ${{ matrix.arch }} (fixable HIGH/CRITICAL)"
            echo ''
            echo '```'
            cat 'trivy-results-${{ matrix.target }}-${{ matrix.arch }}.txt' 2>/dev/null || echo 'Scan produced no output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Combines the per-architecture images into one multi-arch index and tags it.
  # The index is checked before any tag exists: release.yml waits only for the
  # `sha-` tag to appear, so a tagged but incomplete index would get released.
  # No `name:`: a job skipped by its `if` never expands the matrix, so a name
  # built from it would show the raw expression on pull requests.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        target: [frankenphp]
        include:
          - target: frankenphp
            image-suffix: ''

    steps:
      - name: Set the image name
        run: echo "IMAGE=${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}${{ matrix.image-suffix }}" >> "$GITHUB_ENV"

      - name: Download the per-architecture digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, per-commit tag. `main` and `latest` both move, so this
            # is what release.yml retags from when cutting a version -- it
            # guarantees the released image is byte-identical to the one that
            # was built and tested for that commit, rather than a rebuild.
            type=sha,format=long

      # Every platform must be present, each with the provenance attestation
      # buildx attached to it.
      - name: Check the combined index before tagging it
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --dry-run -t "$IMAGE:dry-run" "${refs[@]}" > "$RUNNER_TEMP/index.json"

          jq '.manifests[] | {digest, platform, annotations}' "$RUNNER_TEMP/index.json"

          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/index.json" > /dev/null \
            || { echo "::error::The index is missing a platform."; exit 1; }

          jq -e '([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .annotations["vnd.docker.reference.digest"]] | sort)
                 == ([.manifests[] | select(.platform.os == "linux") | .digest] | sort)' \
            "$RUNNER_TEMP/index.json" > /dev/null \
            || { echo "::error::Each platform needs exactly one attestation."; exit 1; }

      - name: Create and tag the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Show the published index
        run: |
          {
            echo "## Published ${IMAGE}:sha-${GITHUB_SHA}"
            echo ''
            echo '```'
            docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      # `publish` is skipped on pull requests, which is a success there.
      - name: Notify on success
        if: ${{ needs.build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result) }}
        run: |
          echo "✅ Docker images built for amd64 and arm64."
          echo "Images available at: ${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"

      - name: Notify on failure
        if: ${{ needs.build.result == 'failure' || needs.publish.result == 'failure' }}
        run: |
          echo "❌ Docker image build failed!"
          exit 1
