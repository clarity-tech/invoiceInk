name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      # Consumed by deploy-production so it promotes the exact image built here
      # rather than re-resolving a mutable tag.
      digest: ${{ steps.build.outputs.digest }}

    strategy:
      matrix:
        target: [frankenphp]
        # target: [frankenphp, nginx-fpm, standalone, standalone-alpine]
        include:
          - target: frankenphp
            dockerfile: docker/production/Dockerfile.frankenphp
            image-suffix: ''
            build-target: production
          # - target: nginx-fpm
          # dockerfile: docker/production/Dockerfile.nginx-fpm
          # image-suffix: '-nginx'
          # build-target: production
          # - target: standalone
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone'
          # build-target: runtime
          # - target: standalone-alpine
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone-alpine'
          # build-target: standalone-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, per-commit tag. `main` and `latest` both move, so this
            # is what release.yml retags from when cutting a version -- it
            # guarantees the released image is byte-identical to the one that
            # was built and tested for that commit, rather than a rebuild.
            type=sha,format=long

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build-target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.target }}.sarif'
          ignore-unfixed: true

      - name: Debug Trivy output
        run: ls -al

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles(format('trivy-results-{0}.sarif', matrix.target)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.target }}.sarif'

  test-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        target: [frankenphp]
        # target: [frankenphp, nginx-fpm, standalone, standalone-alpine]
        include:
          - target: frankenphp
            image-suffix: ''
            port: 8080
          # - target: nginx-fpm
          #   image-suffix: '-nginx'
          #   port: 80
          # - target: standalone
          #   image-suffix: '-standalone'
          #   port: 8000
          # - target: standalone-alpine
          #   image-suffix: '-standalone-alpine'
          #   port: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Docker image
        run: |
          # Pull the image by digest (guaranteed to exist after build-and-push)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}:pr-${{ github.event.pull_request.number }}"
          echo "Testing image: $IMAGE"

          # Start the container with ServerSideUp env vars
          docker run -d \
            --name test-container \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=testing \
            -e APP_URL=http://localhost:${{ matrix.port }} \
            -e DB_CONNECTION=sqlite \
            -e "DB_DATABASE=/var/www/html/storage/database.sqlite" \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            -e AUTORUN_ENABLED=true \
            -e AUTORUN_LARAVEL_MIGRATION=true \
            -e AUTORUN_LARAVEL_MIGRATION_SKIP_DB_CHECK=true \
            -e AUTORUN_LARAVEL_OPTIMIZE=false \
            "$IMAGE"

          # Wait for container to be healthy
          for i in {1..20}; do
            if curl -sf http://localhost:${{ matrix.port }}/up; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Container failed to start"
              docker logs test-container
              exit 1
            fi
            echo "Attempt $i, retrying..."
            sleep 3
          done

          # Test main page (should redirect to login)
          curl -I http://localhost:${{ matrix.port }}/ | grep -E "(200|302)"

          # Cleanup
          docker stop test-container
          docker rm test-container

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment logic here
          # Example: kubectl, docker-compose, or other deployment tools

  # Deploys to Cloud Run. Requires these GitHub repository variables:
  #   GCP_PROJECT       e.g. invoiceink-prod
  #   GCP_REGION        e.g. asia-south1
  #   GCP_WIF_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
  #   GCP_DEPLOY_SA     github-deployer@<project>.iam.gserviceaccount.com
  #   GCP_DB_HOST       external MySQL hostname
  #   GCP_DB_NAME       database name
  #   GCP_DB_USER       database username
  #   GCP_DB_PORT       database port (DigitalOcean managed MySQL uses 25060)
  #   GCP_DB_SSL_CA     optional CA bundle path; leave unset to skip cert verification
  #   GCP_AWS_KEY_ID    S3 access key id
  #   GCP_AWS_REGION    S3 region
  #   GCP_AWS_BUCKET    S3 bucket
  #   GCP_AWS_URL       public base URL for the bucket
  #   GCP_MAIL_HOST     SMTP host
  #   GCP_MAIL_PORT     SMTP port
  #   GCP_MAIL_USER     SMTP username
  #   GCP_MAIL_FROM     From address
  # (APP_KEY, DB_PASSWORD, MAIL_PASSWORD and AWS_SECRET_ACCESS_KEY come from
  #  Secret Manager, referenced directly by the service YAML.)
  # See docs/cloud_run_deployment_plan.md §14
  deploy-production:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Cloud Run can pull public GHCR images, but same-region Artifact Registry
      # pulls are faster on cold start and remove an external dependency.
      - name: Mirror image into Artifact Registry
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          SRC=ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}
          DST=$REGION-docker.pkg.dev/$PROJECT/docker/invoicing:${{ github.sha }}
          docker buildx imagetools create --tag "$DST" "$SRC"

      # Runs once to completion before any new revision serves traffic. This is
      # why AUTORUN_LARAVEL_MIGRATION is off in the image.
      - name: Run migrations
        run: |
          gcloud run jobs update invoicing-migrate --region=$REGION \
            --image=$REGION-docker.pkg.dev/$PROJECT/docker/invoicing:${{ github.sha }}
          gcloud run jobs execute invoicing-migrate --region=$REGION --wait

      # CLOUD_TASKS_HANDLER must be the worker's URL, which Cloud Run only
      # assigns once the service exists. On the very first deploy the worker is
      # created with a placeholder so its URL can be read back; afterwards the
      # existing URL is reused and both services render with the real value.
      # Renders and deploys via deploy/cloudrun/render.sh rather than repeating
      # its substitution here. That script is the single source of truth: it
      # drops optional entries whose value is intentionally blank (Laravel
      # distinguishes unset from empty, so AWS_URL="" would be used verbatim),
      # stamps each render so an unchanged spec still produces a new revision,
      # and refuses to emit a manifest containing an unsubstituted token.
      - name: Deploy services
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ github.sha }}
          DB_HOST: ${{ vars.GCP_DB_HOST }}
          DB_PORT: ${{ vars.GCP_DB_PORT }}
          DB_NAME: ${{ vars.GCP_DB_NAME }}
          DB_USER: ${{ vars.GCP_DB_USER }}
          DB_SSL_CA: ${{ vars.GCP_DB_SSL_CA }}
          AWS_KEY_ID: ${{ vars.GCP_AWS_KEY_ID }}
          AWS_REGION: ${{ vars.GCP_AWS_REGION }}
          AWS_BUCKET: ${{ vars.GCP_AWS_BUCKET }}
          AWS_URL: ${{ vars.GCP_AWS_URL }}
          MAIL_HOST: ${{ vars.GCP_MAIL_HOST }}
          MAIL_PORT: ${{ vars.GCP_MAIL_PORT }}
          MAIL_USER: ${{ vars.GCP_MAIL_USER }}
          MAIL_FROM: ${{ vars.GCP_MAIL_FROM }}
          # No deploy.env in CI; render.sh falls back to the environment.
          DEPLOY_ENV_FILE: /dev/null
        run: |
          set -euo pipefail

          # CLOUD_TASKS_HANDLER needs the worker's URL, which Cloud Run only
          # assigns once the service exists. Bootstrap it on a first deploy.
          WORKER_URL="$(gcloud run services describe invoicing-worker \
            --region="$REGION" --format='value(status.url)' 2>/dev/null || true)"

          if [ -z "$WORKER_URL" ]; then
            echo "Worker not found — bootstrapping to obtain its URL."
            WORKER_URL=https://placeholder.invalid \
              ./deploy/cloudrun/render.sh worker > /tmp/worker-bootstrap.yaml
            gcloud run services replace /tmp/worker-bootstrap.yaml --region="$REGION"
            WORKER_URL="$(gcloud run services describe invoicing-worker \
              --region="$REGION" --format='value(status.url)')"
          fi

          echo "Worker URL: $WORKER_URL"

          # Worker first: the handler must exist before the public service can
          # enqueue to it.
          for SVC in worker web; do
            WORKER_URL="$WORKER_URL" ./deploy/cloudrun/render.sh "$SVC" > "/tmp/$SVC.yaml"
            gcloud run services replace "/tmp/$SVC.yaml" --region="$REGION"
          done

      # Jobs run the same application and need the same configuration. Derived
      # from the rendered worker manifest so the two cannot drift.
      - name: Sync job configuration
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ github.sha }}
          DB_HOST: ${{ vars.GCP_DB_HOST }}
          DB_PORT: ${{ vars.GCP_DB_PORT }}
          DB_NAME: ${{ vars.GCP_DB_NAME }}
          DB_USER: ${{ vars.GCP_DB_USER }}
          DB_SSL_CA: ${{ vars.GCP_DB_SSL_CA }}
          AWS_KEY_ID: ${{ vars.GCP_AWS_KEY_ID }}
          AWS_REGION: ${{ vars.GCP_AWS_REGION }}
          AWS_BUCKET: ${{ vars.GCP_AWS_BUCKET }}
          AWS_URL: ${{ vars.GCP_AWS_URL }}
          MAIL_HOST: ${{ vars.GCP_MAIL_HOST }}
          MAIL_PORT: ${{ vars.GCP_MAIL_PORT }}
          MAIL_USER: ${{ vars.GCP_MAIL_USER }}
          MAIL_FROM: ${{ vars.GCP_MAIL_FROM }}
          DEPLOY_ENV_FILE: /dev/null
        run: |
          set -euo pipefail
          for J in invoicing-prune invoicing-exchange-rates; do
            gcloud run jobs update "$J" --region="$REGION" \
              --image=$REGION-docker.pkg.dev/$PROJECT/docker/invoicing:${{ github.sha }} --quiet
          done
          ./deploy/cloudrun/update-jobs.sh

  notify:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: ${{ needs.build-and-push.result == 'success' }}
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo "Images available at: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

      - name: Notify on failure
        if: ${{ needs.build-and-push.result == 'failure' }}
        run: |
          echo "❌ Docker image build failed!"
          exit 1
