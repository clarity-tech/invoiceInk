name: CI & Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    # No paths-ignore on push, for two reasons. release.yml's tag-images polls
    # for the image this workflow publishes for that exact commit and fails the
    # release if it never appears. And `deploy-production` now waits on the test
    # jobs, so skipping them on a release commit would skip the deploy with them.
  pull_request:
    branches:
      - main
      - develop
    # Safe on pull requests: nothing consumes a PR image now that the smoke
    # test runs inside the build job.
    paths-ignore:
      - '**.md'
      - 'version.txt'
      - '.release-please-manifest.json'

# A superseded image build has nothing to offer once a newer commit is pushed.
# `release` is deliberately excluded from this pattern -- it must not be
# cancelled mid-retag.
# Superseding a pull request build is free. Superseding a push to main is not:
# this workflow deploys, and cancelling it between `gcloud run jobs execute` and
# its completion leaves a migration running server-side with nothing watching it.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for jobs that declare none; the publishing and deploying jobs widen
# this for themselves.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-php:
    name: PHP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          sed -i 's|FILESYSTEM_DISK=.*|FILESYSTEM_DISK=local|' .env
          echo "MEDIA_DISK=public" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "TELESCOPE_ENABLED=false" >> .env
          echo "GOTENBERG_ENABLED=true" >> .env
          echo "GOTENBERG_URL=http://localhost:3000" >> .env

      - name: Start Gotenberg PDF service
        run: |
          docker run -d --name gotenberg \
            -p 3000:3000 \
            gotenberg/gotenberg:8 \
            gotenberg --chromium-disable-javascript=true --api-timeout=30s
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done'

      - name: Run Unit & Feature tests
        run: php artisan test --testsuite=Unit,Feature --compact

  test-octane:
    name: Production Image (FrankenPHP) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies, build assets, and install Playwright
        run: |
          bun install --frozen-lockfile
          bun run build
          npx playwright install chromium --with-deps

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          echo "TELESCOPE_ENABLED=false" >> .env
          touch database/database.sqlite
          php artisan migrate --force

      # docker-build.yml builds this exact Dockerfile and target with a GitHub
      # Actions layer cache. Building it here the same way turns a ~4 minute cold
      # build into a cache hit; `load: true` puts it in the local daemon so
      # test-octane.sh can run it. Cache is read-only -- docker-build.yml owns
      # writing it, and two writers would just thrash the same key.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.frankenphp
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: invoicing-test:octane
          cache-from: type=gha
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      - name: Run production image tests
        env:
          SKIP_IMAGE_BUILD: '1'
        run: ./docker/production/test-octane.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs invoicing-octane-test 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: octane-browser-screenshots
          path: tests/Browser/Screenshots/
          retention-days: 7

  test-frontend:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      # `composer install` costs ~10s in each job and the lockfile rarely moves.
      # Exact key only: a partially restored vendor/ is worse than none.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-php8.5-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (format check)
        run: vendor/bin/pint --test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --with-form must match `wayfinder({ formVariants: true })` in
      # vite.config.ts. Without it the generated route helpers have no .form
      # property, while the Auth pages use it -- so vue-tsc reported seven
      # errors that exist nowhere but here. The production Dockerfile already
      # passes this flag; only this step had drifted.
      - name: Generate Wayfinder typed routes
        run: php artisan wayfinder:generate --path=resources/js --with-form --no-interaction

      # A ratchet rather than a plain gate. 21 errors remain, all of them the
      # same thing: test mocks that are structurally right but are not the
      # branded `InertiaForm<T>` type the components declare. Clearing those
      # needs a typed factory and was deliberately deferred, so failing on any
      # error would fail every build.
      #
      # Failing on *more* than the known count still catches every new error,
      # which is the part worth enforcing. Lower this number as the remainder
      # is cleared; it must never be raised to accommodate new errors.
      - name: TypeScript check (ratchet)
        env:
          BASELINE: 21
        run: |
          set -o pipefail
          bun run types:check 2>&1 | tee /tmp/tsc.log || true
          COUNT=$(grep -cE 'error TS' /tmp/tsc.log || true)
          echo "type errors: $COUNT (baseline $BASELINE)"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::$COUNT type errors, above the baseline of $BASELINE."
            grep -E 'error TS' /tmp/tsc.log || true
            exit 1
          fi
          if [ "$COUNT" -lt "$BASELINE" ]; then
            echo "::notice::$COUNT type errors, below the baseline of $BASELINE -- lower BASELINE in this workflow."
          fi

      - name: Run Vitest
        run: bun run test

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    outputs:
      # Consumed by deploy-production so it promotes the exact image built here
      # rather than re-resolving a mutable tag.
      digest: ${{ steps.build.outputs.digest }}

    strategy:
      matrix:
        target: [frankenphp]
        # target: [frankenphp, nginx-fpm, standalone, standalone-alpine]
        include:
          - target: frankenphp
            dockerfile: docker/production/Dockerfile.frankenphp
            image-suffix: ''
            build-target: production
            port: 8080
          # - target: nginx-fpm
          # dockerfile: docker/production/Dockerfile.nginx-fpm
          # image-suffix: '-nginx'
          # build-target: production
          # - target: standalone
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone'
          # build-target: runtime
          # - target: standalone-alpine
          # dockerfile: docker/production/Dockerfile.standalone
          # image-suffix: '-standalone-alpine'
          # build-target: standalone-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable, per-commit tag. `main` and `latest` both move, so this
            # is what release.yml retags from when cutting a version -- it
            # guarantees the released image is byte-identical to the one that
            # was built and tested for that commit, rather than a rebuild.
            type=sha,format=long

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build-target }}
          platforms: linux/amd64
          # A pull request has no consumer for its image: nothing deploys it and
          # release.yml only ever retags a `main` commit. Load it into the local
          # daemon so the smoke test below can run, and publish only from
          # branches and tags.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      # Runs here rather than in a separate job because a pull request's image
      # is only in this runner's local daemon -- there is nothing in the
      # registry for another job to pull.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}:pr-${{ github.event.pull_request.number }}"
          echo "Testing image: $IMAGE"

          docker run -d \
            --name test-container \
            -p ${{ matrix.port }}:${{ matrix.port }} \
            -e "APP_KEY=base64:$(openssl rand -base64 32)" \
            -e APP_ENV=testing \
            -e APP_URL=http://localhost:${{ matrix.port }} \
            -e DB_CONNECTION=sqlite \
            -e "DB_DATABASE=/var/www/html/storage/database.sqlite" \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            -e AUTORUN_ENABLED=true \
            -e AUTORUN_LARAVEL_MIGRATION=true \
            -e AUTORUN_LARAVEL_MIGRATION_SKIP_DB_CHECK=true \
            -e AUTORUN_LARAVEL_OPTIMIZE=false \
            "$IMAGE"

          for i in {1..20}; do
            if curl -sf http://localhost:${{ matrix.port }}/up; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Container failed to start"
              docker logs test-container
              exit 1
            fi
            echo "Attempt $i, retrying..."
            sleep 3
          done

          curl -I http://localhost:${{ matrix.port }}/ | grep -E "(200|302)"

          docker stop test-container
          docker rm test-container

      # A pull request's image is loaded locally rather than pushed, so there is
      # no registry digest to scan -- point Trivy at the local tag instead. The
      # scan is `continue-on-error`, so an unresolvable ref would have failed
      # silently and quietly stopped scanning pull requests altogether.
      - name: Resolve the image reference to scan
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image-suffix }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SCAN_REF=${BASE}:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=${BASE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          fi

      # Findings go to the run summary rather than the Security tab: uploading
      # SARIF needs Advanced Security, which this private repo does not have,
      # so that upload 403'd and failed the whole workflow on every build.
      #
      # `exit-code: 0` keeps the scan advisory. The image currently carries
      # fixable HIGH/CRITICAL findings from the Debian base, the bundled Node
      # packages and the FrankenPHP binary, so gating on them would fail every
      # build from the moment this lands. Turn the gate on once that backlog is
      # cleared -- the summary below is what makes the backlog visible.
      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: 'table'
          output: 'trivy-results-${{ matrix.target }}.txt'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Publish Trivy findings to the run summary
        if: always()
        run: |
          {
            echo "## Trivy — ${{ matrix.target }} (fixable HIGH/CRITICAL)"
            echo ''
            echo '```'
            cat 'trivy-results-${{ matrix.target }}.txt' 2>/dev/null || echo 'Scan produced no output.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment logic here
          # Example: kubectl, docker-compose, or other deployment tools

  # Deploys to Cloud Run. Requires these GitHub repository variables:
  #   GCP_PROJECT       e.g. invoiceink-prod
  #   GCP_REGION        e.g. asia-south1
  #   GCP_WIF_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/github/providers/github
  #   GCP_DEPLOY_SA     github-deployer@<project>.iam.gserviceaccount.com
  #   GCP_DB_HOST       external MySQL hostname
  #   GCP_DB_NAME       database name
  #   GCP_DB_USER       database username
  #   GCP_DB_PORT       database port (DigitalOcean managed MySQL uses 25060)
  #   GCP_DB_SSL_CA     optional CA bundle path; leave unset to skip cert verification
  #   GCP_AWS_KEY_ID    S3 access key id
  #   GCP_AWS_REGION    S3 region
  #   GCP_AWS_BUCKET    S3 bucket
  #   GCP_AWS_URL       public base URL for the bucket
  #   GCP_MAIL_HOST     SMTP host
  #   GCP_MAIL_PORT     SMTP port
  #   GCP_MAIL_USER     SMTP username
  #   GCP_MAIL_FROM     From address
  # (APP_KEY, DB_PASSWORD, MAIL_PASSWORD and AWS_SECRET_ACCESS_KEY come from
  #  Secret Manager, referenced directly by the service YAML.)
  # See docs/cloud_run_deployment_plan.md §14
  deploy-production:
    # The hard gate. Branch protection is unavailable on this plan, so PR checks
    # cannot be made required and a red PR can still be merged -- this `needs:`
    # is the only thing that actually stops untested code reaching production.
    # `build-and-push` stays ungated so the image for a release commit appears
    # promptly for release.yml's tag-images, which polls for it.
    needs: [build-and-push, test-php, test-octane, test-frontend]
    if: github.ref == 'refs/heads/main'
    # A local `uses:` runs the called workflow from this same commit and inside
    # this same run, so the gate above and the SHA below are genuinely ours --
    # unlike `workflow_run`, which resolves to the newest commit on the default
    # branch and would not fire at all when CI is skipped.
    uses: ./.github/workflows/deploy-production.yml
    with:
      image_ref: ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}
      tag: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, requested in the called workflow

  notify:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Notify on success
        if: ${{ needs.build-and-push.result == 'success' }}
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo "Images available at: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

      - name: Notify on failure
        if: ${{ needs.build-and-push.result == 'failure' }}
        run: |
          echo "❌ Docker image build failed!"
          exit 1
