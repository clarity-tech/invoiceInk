# Semantic versioning driven by conventional commits.
#
# release-please watches main and maintains a standing "release PR" that bumps
# version.txt and writes CHANGELOG.md from the commits since the last release.
# Merging that PR creates the git tag and the GitHub release. Nothing is
# versioned until you choose to merge it, so main stays continuously deployable
# while releases remain a deliberate act.
#
# A release does not deploy -- it labels the image already built for that
# commit, so a deployment can name a version rather than a 40-character SHA.
#
# Images are retagged, never rebuilt, so a released version is byte-identical to
# the artifact that was built and tested for that commit.

name: Release

on:
  push:
    branches: [main]
  # Lets release-please be re-run after fixing something outside the repository
  # -- the first run failed on the "Allow GitHub Actions to create and approve
  # pull requests" setting -- without needing an empty commit to retrigger it.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags and releases
      pull-requests: write # maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Adds version tags to the image already published for this commit. Runs only
  # when a release was actually cut.
  tag-images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Polls for the image docker-build.yml publishes, so it needs headroom.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push tags to GHCR

    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      MAJOR: ${{ needs.release-please.outputs.major }}
      MINOR: ${{ needs.release-please.outputs.minor }}

    steps:
      # Image names must be lowercase; the repository name is not.
      - name: Set the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release-please tags the same commit that docker-build.yml is building
      # from, and the two workflows run concurrently. Wait for the image rather
      # than racing it.
      - name: Wait for this commit's image
        run: |
          set -euo pipefail
          SRC=$IMAGE:sha-${{ github.sha }}
          for i in $(seq 1 40); do
            if docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then
              echo "Found $SRC after $((i*30))s"
              exit 0
            fi
            echo "Waiting for $SRC ... ($i/40)"
            sleep 30
          done
          echo "::error::Image $SRC never appeared; not tagging a release that has no artifact." >&2
          exit 1

      - name: Tag GHCR image with the version
        run: |
          set -euo pipefail
          SRC=$IMAGE:sha-${{ github.sha }}
          docker buildx imagetools create \
            --tag "$IMAGE:v${VERSION}" \
            --tag "$IMAGE:${MAJOR}.${MINOR}" \
            --tag "$IMAGE:${MAJOR}" \
            "$SRC"

      - name: Summary
        run: |
          {
            echo "### Released \`${{ needs.release-please.outputs.tag_name }}\`"
            echo
            echo "Image tagged, pointing at the digest built for this commit:"
            echo '```'
            echo "$IMAGE:v${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
