name: CI

on:
  push:
    branches: [main]
    # release-please PRs only touch the changelog, version.txt and the manifest.
    # There is no code in them to test, and the image they would release is
    # retagged from a `main` commit CI has already run against.
    paths-ignore: &metadata-only
      - '**.md'
      - 'version.txt'
      - '.release-please-manifest.json'
  pull_request:
    branches: [main, with-jetstream]
    paths-ignore: *metadata-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Pint (format check)
        run: vendor/bin/pint --test

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run vue-tsc --noEmit --skipLibCheck 2>/dev/null || true

  test-php:
    name: PHP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          sed -i 's|FILESYSTEM_DISK=.*|FILESYSTEM_DISK=local|' .env
          echo "MEDIA_DISK=public" >> .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "TELESCOPE_ENABLED=false" >> .env
          echo "GOTENBERG_ENABLED=true" >> .env
          echo "GOTENBERG_URL=http://localhost:3000" >> .env

      - name: Start Gotenberg PDF service
        run: |
          docker run -d --name gotenberg \
            -p 3000:3000 \
            gotenberg/gotenberg:8 \
            gotenberg --chromium-disable-javascript=true --api-timeout=30s
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health; do sleep 1; done'

      - name: Run Unit & Feature tests
        run: php artisan test --testsuite=Unit,Feature --compact

  test-octane:
    name: Production Image (FrankenPHP) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies, build assets, and install Playwright
        run: |
          bun install --frozen-lockfile
          bun run build
          npx playwright install chromium --with-deps

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          echo "TELESCOPE_ENABLED=false" >> .env
          touch database/database.sqlite
          php artisan migrate --force

      # docker-build.yml builds this exact Dockerfile and target with a GitHub
      # Actions layer cache. Building it here the same way turns a ~4 minute cold
      # build into a cache hit; `load: true` puts it in the local daemon so
      # test-octane.sh can run it. Cache is read-only -- docker-build.yml owns
      # writing it, and two writers would just thrash the same key.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile.frankenphp
          target: production
          platforms: linux/amd64
          load: true
          push: false
          tags: invoicing-test:octane
          cache-from: type=gha
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_APP_NAME=InvoiceInk

      - name: Run production image tests
        env:
          SKIP_IMAGE_BUILD: '1'
        run: ./docker/production/test-octane.sh

      - name: Show container logs on failure
        if: failure()
        run: docker logs invoicing-octane-test 2>/dev/null || true

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octane-browser-screenshots
          path: tests/Browser/Screenshots/
          retention-days: 7

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate Wayfinder typed routes
        run: php artisan wayfinder:generate --path=resources/js --no-interaction

      - name: Run Vitest
        run: bun run test

  test-browser:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=:memory:|' .env
          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env
          echo "TELESCOPE_ENABLED=false" >> .env

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Browser Smoke Tests
        run: php artisan test tests/Browser/SmokeTest.php tests/Browser/AuthenticatedSmokeTest.php --compact

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          retention-days: 7

  build-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run build
